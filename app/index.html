<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red → Green</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    padding: 2rem;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #14161a;
    color: #e8eaed;
  }
  h1 { font-weight: 600; font-size: 1.4rem; margin: 0; }
  #drop {
    width: min(640px, 100%);
    min-height: 220px;
    border: 2px dashed #3a4250;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    text-align: center;
    padding: 2rem;
    box-sizing: border-box;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    color: #9aa3b2;
  }
  #drop.drag { border-color: #4ade80; background: #1b2620; color: #d6f5e0; }
  #drop small { opacity: .7; }
  #result { display: none; flex-direction: column; align-items: center; gap: 1rem; }
  #result img { max-width: min(640px, 100%); border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .row { display: flex; gap: .75rem; flex-wrap: wrap; justify-content: center; }
  button, .btn {
    font: inherit;
    border: none;
    border-radius: 10px;
    padding: .6rem 1.1rem;
    cursor: pointer;
    background: #2a313d;
    color: #e8eaed;
    text-decoration: none;
  }
  button.primary, .btn.primary { background: #22c55e; color: #062812; font-weight: 600; }
  button:hover, .btn:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <h1>Drop an image — red becomes green</h1>

  <div id="drop">
    <strong>Drop an image here</strong>
    <small>or click to choose · you can also paste (Ctrl/⌘+V)</small>
  </div>
  <input id="file" type="file" accept="image/*" hidden>

  <div id="result">
    <img id="out" alt="Processed image">
    <div class="row">
      <a id="download" class="btn primary" download="red-to-green.png">Download</a>
      <button id="again">Try another image</button>
    </div>
  </div>

  <canvas id="canvas" hidden></canvas>

<script>
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file');
  const result = document.getElementById('result');
  const out = document.getElementById('out');
  const download = document.getElementById('download');
  const again = document.getElementById('again');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // Click the drop zone to open the file picker.
  drop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

  // Drag & drop.
  ['dragenter', 'dragover'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  // Paste from clipboard.
  window.addEventListener('paste', e => {
    const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
    if (item) handleFile(item.getAsFile());
  });

  function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) {
      alert('Please drop an image file.');
      return;
    }
    const img = new Image();
    img.onload = () => { process(img); URL.revokeObjectURL(img.src); };
    img.src = URL.createObjectURL(file);
  }

  function process(img) {
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    ctx.drawImage(img, 0, 0);

    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = imgData.data;
    // Swap the red and green channels: red turns green (and green turns red).
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i];
      d[i] = d[i + 1]; // R <- G
      d[i + 1] = r;    // G <- old R
    }
    ctx.putImageData(imgData, 0, 0);

    const url = canvas.toDataURL('image/png');
    out.src = url;
    download.href = url;
    drop.style.display = 'none';
    result.style.display = 'flex';
  }

  again.addEventListener('click', () => {
    result.style.display = 'none';
    drop.style.display = 'flex';
    fileInput.value = '';
  });
</script>
</body>
</html>
