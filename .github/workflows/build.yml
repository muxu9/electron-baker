name: build

on:
  push:
    branches:
      - 'build/**'

jobs:
  # Reads baker.json from the pushed branch and emits a matrix containing only
  # the platforms the user selected. Unselected platforms never get a runner.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        name: Resolve selected platforms
        run: |
          node -e '
            const fs = require("fs");
            let platforms = ["mac", "win", "linux"];
            try {
              const cfg = JSON.parse(fs.readFileSync("baker.json", "utf8"));
              if (Array.isArray(cfg.platforms) && cfg.platforms.length) platforms = cfg.platforms;
            } catch (e) {}
            const map = { mac: "macos-latest", win: "windows-latest", linux: "ubuntu-latest" };
            const include = platforms.filter(p => map[p]).map(p => ({ os: map[p], platform: p }));
            const out = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(out, "matrix=" + JSON.stringify({ include }) + "\n");
            fs.appendFileSync(out, "count=" + include.length + "\n");
            console.log("Building for:", include.map(i => i.platform).join(", ") || "(none)");
          '

  build:
    needs: setup
    if: needs.setup.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build ${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME#build/}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Build ${{ steps.tag.outputs.tag }}" \
            --notes "Automated Electron build for ${{ steps.tag.outputs.tag }}" \
            artifacts/*/*
